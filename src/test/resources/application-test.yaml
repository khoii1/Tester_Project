spring:
  application:
    name: Spring-Security-Test

  # H2 In-Memory Database for Testing
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true

  flyway:
    enabled: false # Disable Flyway for tests (use JPA auto schema creation)

  # Mock Email Configuration (no real emails sent)
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # OAuth2 - Disabled for tests
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

# Custom Security Configuration for Testing
app:
  security:
    jwt:
      secret-key: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1wdXJwb3Nlcy1vbmx5LW5vdC1mb3ItcHJvZHVjdGlvbg==
      access-token-expiration: 900000 # 15 minutes
      refresh-token-expiration: 604800000 # 7 days
      registration-token-expiration: 600000 # 10 minutes

    cors:
      allowed-origins: http://localhost:3000

    oauth2:
      redirect-uri: http://localhost:3000/dashboard

    email:
      reset-password-url: http://localhost:3000/reset-password
      reset-password-expiration: 15

  # Disable admin seeding in tests
  seed:
    enabled: false

# Logging configuration for tests
logging:
  level:
    com.noel.springsecurity: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
